<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Datetime</title>
    <link rel="stylesheet" href="../../../common.css" />
    <script src="../../../common.js"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/@ionic/core@9/dist/ionic/ionic.esm.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@ionic/core@9/css/ionic.bundle.css" />

    <style>
      ion-datetime {
        --range-background: rgb(235, 68, 90, 0.1);
      }

      ion-datetime::part(range-start),
      ion-datetime::part(range-end) {
        background: rgb(235, 68, 90);
      }

      ion-datetime::part(range-start) {
        border-radius: 32px 0 0 32px;
      }

      ion-datetime::part(range-end) {
        border-radius: 0 32px 32px 0;
      }

      ion-datetime::part(range-start range-end) {
        border-radius: 50%;
      }

      ion-datetime::part(range-track)::before {
        height: 24px;
      }
    </style>
  </head>

  <body>
    <ion-app>
      <ion-content>
        <div class="container">
          <ion-datetime presentation="date" selection-mode="range"></ion-datetime>
        </div>
      </ion-content>
    </ion-app>
  </body>
</html>
