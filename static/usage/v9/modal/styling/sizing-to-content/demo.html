<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modal | Sizing to Content</title>
    <link rel="stylesheet" href="../../../common.css" />
    <script src="../../../common.js"></script>
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/@ionic/core@9.0.1-dev.11788212611.154b1596/dist/ionic/ionic.esm.js"
    ></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@ionic/core@9.0.1-dev.11788212611.154b1596/css/ionic.bundle.css"
    />
    <style>
      ion-modal {
        --height: fit-content;
        --width: 90%;
        --border-radius: 8px;
        --box-shadow: 0 28px 48px rgba(0, 0, 0, 0.4);
      }
    </style>
  </head>

  <body>
    <ion-app>
      <ion-header>
        <ion-toolbar>
          <ion-title>App</ion-title>
        </ion-toolbar>
      </ion-header>
      <ion-content class="ion-padding">
        <ion-button id="open-modal" expand="block">Open Modal</ion-button>

        <ion-modal trigger="open-modal">
          <ion-header>
            <ion-toolbar>
              <ion-title>Modal</ion-title>
              <ion-buttons slot="end">
                <ion-button onclick="modal.dismiss()">Close</ion-button>
              </ion-buttons>
            </ion-toolbar>
          </ion-header>
          <ion-content>
            <ion-list lines="full">
              <ion-item>
                <ion-label>Item 1</ion-label>
              </ion-item>
              <ion-item>
                <ion-label>Item 2</ion-label>
              </ion-item>
              <ion-item>
                <ion-label>Item 3</ion-label>
              </ion-item>
            </ion-list>
          </ion-content>
        </ion-modal>
      </ion-content>
    </ion-app>

    <script>
      var modal = document.querySelector('ion-modal');
    </script>
  </body>
</html>
