<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Font Icons</title>
    <link rel="stylesheet" href="../../common.css" />
    <script src="../../common.js"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/@ionic/core@9/dist/ionic/ionic.esm.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@ionic/core@9/css/ionic.bundle.css" />

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" />

    <!-- Remix Icons -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />

    <!-- Phosphor Icons -->
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css"
    />

    <style>
      .container {
        flex-direction: column;
        gap: 8px;
        text-align: center;
      }

      .row {
        display: flex;
        gap: 12px;
      }

      .row > ion-icon {
        font-size: 24px;
      }
    </style>
  </head>

  <body>
    <ion-app>
      <ion-content>
        <div class="container">
          <h2>Font Awesome Icons</h2>
          <div class="row">
            <ion-icon color="primary">
              <i class="fas fa-house"></i>
            </ion-icon>
            <ion-icon color="secondary">
              <i class="fas fa-heart"></i>
            </ion-icon>
            <ion-icon color="tertiary">
              <i class="fas fa-star"></i>
            </ion-icon>
            <ion-icon color="success">
              <i class="fas fa-circle-check"></i>
            </ion-icon>
            <ion-icon color="warning">
              <i class="fas fa-triangle-exclamation"></i>
            </ion-icon>
            <ion-icon color="danger">
              <i class="fas fa-trash"></i>
            </ion-icon>
          </div>
          <div class="row">
            <ion-button size="small" fill="outline">
              <ion-icon slot="start">
                <i class="fas fa-house"></i>
              </ion-icon>
              Home
            </ion-button>
            <ion-button size="small" fill="outline" color="tertiary">
              <ion-icon slot="start">
                <i class="fas fa-star"></i>
              </ion-icon>
              Save
            </ion-button>
            <ion-button size="small" fill="outline" color="danger">
              <ion-icon slot="start">
                <i class="fas fa-trash"></i>
              </ion-icon>
              Trash
            </ion-button>
          </div>

          <h2>Bootstrap Icons</h2>
          <div class="row">
            <ion-icon color="primary">
              <i class="bi bi-house-fill"></i>
            </ion-icon>
            <ion-icon color="secondary">
              <i class="bi bi-heart-fill"></i>
            </ion-icon>
            <ion-icon color="tertiary">
              <i class="bi bi-star-fill"></i>
            </ion-icon>
            <ion-icon color="success">
              <i class="bi bi-check-circle-fill"></i>
            </ion-icon>
            <ion-icon color="warning">
              <i class="bi bi-exclamation-triangle-fill"></i>
            </ion-icon>
            <ion-icon color="danger">
              <i class="bi bi-trash-fill"></i>
            </ion-icon>
          </div>
          <div class="row">
            <ion-button size="small" fill="outline">
              <ion-icon slot="start">
                <i class="bi bi-house-fill"></i>
              </ion-icon>
              Home
            </ion-button>
            <ion-button size="small" fill="outline" color="tertiary">
              <ion-icon slot="start">
                <i class="bi bi-star-fill"></i>
              </ion-icon>
              Save
            </ion-button>
            <ion-button size="small" fill="outline" color="danger">
              <ion-icon slot="start">
                <i class="bi bi-trash-fill"></i>
              </ion-icon>
              Trash
            </ion-button>
          </div>

          <h2>Remix Icons</h2>
          <div class="row">
            <ion-icon color="primary">
              <i class="ri-home-fill"></i>
            </ion-icon>
            <ion-icon color="secondary">
              <i class="ri-heart-fill"></i>
            </ion-icon>
            <ion-icon color="tertiary">
              <i class="ri-star-fill"></i>
            </ion-icon>
            <ion-icon color="success">
              <i class="ri-checkbox-circle-fill"></i>
            </ion-icon>
            <ion-icon color="warning">
              <i class="ri-alert-fill"></i>
            </ion-icon>
            <ion-icon color="danger">
              <i class="ri-delete-bin-fill"></i>
            </ion-icon>
          </div>
          <div class="row">
            <ion-button size="small" fill="outline">
              <ion-icon slot="start">
                <i class="ri-home-fill"></i>
              </ion-icon>
              Home
            </ion-button>
            <ion-button size="small" fill="outline" color="tertiary">
              <ion-icon slot="start">
                <i class="ri-star-fill"></i>
              </ion-icon>
              Save
            </ion-button>
            <ion-button size="small" fill="outline" color="danger">
              <ion-icon slot="start">
                <i class="ri-delete-bin-fill"></i>
              </ion-icon>
              Trash
            </ion-button>
          </div>

          <h2>Phosphor Icons</h2>
          <div class="row">
            <ion-icon color="primary">
              <i class="ph-fill ph-house"></i>
            </ion-icon>
            <ion-icon color="secondary">
              <i class="ph-fill ph-heart"></i>
            </ion-icon>
            <ion-icon color="tertiary">
              <i class="ph-fill ph-star"></i>
            </ion-icon>
            <ion-icon color="success">
              <i class="ph-fill ph-check-circle"></i>
            </ion-icon>
            <ion-icon color="warning">
              <i class="ph-fill ph-warning"></i>
            </ion-icon>
            <ion-icon color="danger">
              <i class="ph-fill ph-trash"></i>
            </ion-icon>
          </div>
          <div class="row">
            <ion-button size="small" fill="outline">
              <ion-icon slot="start">
                <i class="ph-fill ph-house"></i>
              </ion-icon>
              Home
            </ion-button>
            <ion-button size="small" fill="outline" color="tertiary">
              <ion-icon slot="start">
                <i class="ph-fill ph-star"></i>
              </ion-icon>
              Save
            </ion-button>
            <ion-button size="small" fill="outline" color="danger">
              <ion-icon slot="start">
                <i class="ph-fill ph-trash"></i>
              </ion-icon>
              Trash
            </ion-button>
          </div>
        </div>
      </ion-content>
    </ion-app>
  </body>
</html>
