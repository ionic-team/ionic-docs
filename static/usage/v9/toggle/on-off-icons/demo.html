<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Toggle - On / Off Icons</title>
    <link rel="stylesheet" href="../../common.css" />
    <script src="../../common.js"></script>
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/@ionic/core@9.0.13-dev.11795209321.12c3c69e/dist/ionic/ionic.esm.js"
    ></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@ionic/core@9.0.13-dev.11795209321.12c3c69e/css/ionic.bundle.css"
    />
  </head>

  <body>
    <ion-app>
      <ion-content>
        <div class="container">
          <ion-toggle enable-on-off-labels="true" checked-icon="moon" unchecked-icon="sunny">Dark Mode</ion-toggle>
        </div>
      </ion-content>
    </ion-app>
  </body>
</html>
