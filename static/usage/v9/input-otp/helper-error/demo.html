<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Input OTP</title>
    <link rel="stylesheet" href="../../common.css" />
    <script src="../../common.js"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/@ionic/core@9/dist/ionic/ionic.esm.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@ionic/core@9/css/ionic.bundle.css" />
  </head>

  <body>
    <ion-app>
      <ion-content>
        <div class="container">
          <ion-input-otp
            helper-text="Enter the code sent to your email"
            error-text="Enter all 4 digits"
          ></ion-input-otp>
        </div>
      </ion-content>
    </ion-app>

    <script>
      const inputOtp = document.querySelector('ion-input-otp');

      inputOtp.addEventListener('ionInput', (event) => validate(event));
      inputOtp.addEventListener('ionBlur', () => markTouched());

      const validate = (event) => {
        const value = event.detail.value ?? '';

        inputOtp.classList.remove('ion-valid');
        inputOtp.classList.remove('ion-invalid');

        value.length === 4 ? inputOtp.classList.add('ion-valid') : inputOtp.classList.add('ion-invalid');
      };

      const markTouched = () => {
        inputOtp.classList.add('ion-touched');
      };
    </script>
  </body>
</html>
